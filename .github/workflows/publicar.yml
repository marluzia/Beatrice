# Publica a CEDER no GitHub Pages a cada push na main.
#
# É isto que dá ao time uma URL para abrir no navegador e emitir relatório sem
# instalar nada. Cada pessoa guarda as casas dos próprios contatos no
# localStorage do navegador dela — nada vai para servidor nenhum, e por isso
# não existe conta nem login.
#
# ATENÇÃO, antes de ligar isto:
#
#  · GitHub Pages em repositório PÚBLICO deixa o código do motor público.
#    O motor é o ativo do projeto; essa é uma decisão de negócio, não técnica.
#  · Pages em repositório privado exige plano pago.
#  · A alternativa que o README já menciona é a Vercel, que publica de um
#    repositório privado de graça. Se for por ali, apague este arquivo.
#
# Para ligar: Settings → Pages → Source: GitHub Actions.

name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se vierem dois pushes, o segundo espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar
        run: npm ci

      # `build` já roda `checar` antes: erro de tipo não vai para o ar.
      - name: Construir
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
